<section
    class="w-full max-w-7xl mx-auto px-6 py-20"
    x-data="{
        cards: { title: '', card: [] },

        async loadCards() {
            try {
                const response = await fetch('src/data/cards.json');
                this.cards = await response.json();
            } catch (error) {
                console.error('Erro ao carregar CARDs:', error);
            }
        },

        getCardStyle(index) {
            const styles = [
                'bg-[#0F682E] text-white',
                'bg-black text-white',
                'bg-[#BFBFBF] text-black',
                'bg-white border border-gray-300 text-black'
            ];
            return styles[index] || 'bg-gray-100';
        },

        getIcon(index) {
            const icons = [
                'photo_camera',
                'folder_open',
                'update',
                'deployed_code'
            ];
            return icons[index] || 'info';
        }
    }"
    x-init="loadCards()"
>

    <h2
        class="serif text-5xl md:text-6xl text-black mb-16 leading-tight"
        x-text="cards.title">
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" x-show="cards.card.length">

        <template x-for="(card, index) in cards.card" :key="index">

            <div
                class="group p-8 md:p-10 min-h-[250px] flex flex-col justify-between transition-transform hover:-translate-y-1 duration-300"
                :class="getCardStyle(index)"
            >

                <div>

                    <div class="mb-6">
                        <span
                            class="material-symbols-outlined text-5xl"
                            x-text="getIcon(index)">
                        </span>
                    </div>

                    <h3
                        class="font-bold text-xl mb-3"
                        x-text="card.title">
                    </h3>

                    <p
                        class="text-sm leading-relaxed max-w-sm"
                        x-text="card.description">
                    </p>

                </div>

            </div>

        </template>

    </div>

</section>
