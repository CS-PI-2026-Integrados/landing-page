<header id="navbar" class="z-10 flex-col px-4 py-2 end-0 fixed w-full transition flex duration-500">
    <div x-data="{open: false}" class="flex container mx-auto flex-col gap-2">
        <div class="flex">
            <a id="logo" href="#hero" class="text-[var(--green)] flex my-auto text-2xl">
                <span class="font-bold logo">SIC</span>
                <span class="font-regular logo">APE</span>
            </a>
            <div class="ms-auto flex gap-2 items-center">
                <div class="gap-2 hidden sm:flex">
                    <div x-data="{ dropOpen: false }" @mouseenter="dropOpen = true" @mouseleave="dropOpen = false"
                        class="relative flex items-center">
                    
                        <button
                            class="cursor-pointer hover:backdrop-blur-lg hover:bg-neutral-900/50 flex items-center gap-1.5 hover:scale-95 transition rounded-lg px-3 py-2 text-white">
                    
                            <img :src="$store.i18n.locale === 'en' ? './assets/icon/us.svg' : ($store.i18n.locale === 'es' ? './assets/icon/spain.svg' : './assets/icon/brazil.svg')"
                                class="w-5 h-5 object-cover" alt="Idioma atual">
                    
                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                        </button>
                    
                        <div x-show="dropOpen" x-transition.opacity style="display: none;"
                            class="absolute right-0 top-full mt-1 w-40 origin-top-right rounded-lg bg-neutral-900/90 backdrop-blur-lg border border-neutral-700 shadow-lg outline-none overflow-hidden z-50">
                            <div class="py-1 flex flex-col">
                                <button @click="$store.i18n.setLang('pt')"
                                    class="text-left px-4 py-2 text-sm text-white hover:bg-neutral-700 transition flex items-center gap-3">
                                    <img src="./assets/icon/brazil.svg" alt="Brasil" class="w-6 h-6">
                                    <span class="text-md">Português</span>
                                </button>
                                <button @click="$store.i18n.setLang('en')"
                                    class="text-left px-4 py-2 text-sm text-white hover:bg-neutral-700 transition flex items-center gap-3">
                                    <img src="./assets/icon/us.svg" alt="Estados Unidos" class="w-6 h-6">
                                    <span class="text-md">English</span>
                                </button>
                                <button @click="$store.i18n.setLang('es')"
                                    class="text-left px-4 py-2 text-sm text-white hover:bg-neutral-700 transition flex items-center gap-3">
                                    <img src="./assets/icon/spain.svg" alt="Espanha" class="w-6 h-6">
                                    <span class="text-md">Español</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    </div>
                    <button onclick="changeFontSize(2)"
                        class="cursor-pointer hover:backdrop-blur-lg hover:bg-neutral-900/50 flex hover:scale-95 transition rounded-lg px-3 py-2 text-white">A+</button>
                    <button onclick="changeFontSize(-2)"
                        class="cursor-pointer hover:backdrop-blur-lg hover:bg-neutral-900/50 flex hover:scale-95 transition rounded-lg px-3 py-2 text-white">A-</button>
                    <button @click="highContrast = !highContrast" x-bind:class="highContrast ? 'bg-neutral-900/50' : ''"
                        class="cursor-pointer hover:backdrop-blur-lg hover:bg-neutral-900/50 flex hover:scale-95 transition rounded-lg px-3 py-2 text-white">
                        <i class="fa-solid fa-circle-half-stroke m-auto"></i>
                    </button>
                    <a href="#hero" x-text="$store.i18n.t('nav.home')"
                        class="hover:backdrop-blur-lg hover:bg-neutral-900/50 flex hover:scale-95 transition rounded-lg px-3 py-2 text-white"></a>
                    <a href="#about" x-text="$store.i18n.t('nav.about')"
                        class="hover:backdrop-blur-lg hover:bg-neutral-900/50 flex hover:scale-95 transition rounded-lg px-3 py-2 text-white"></a>
                    <a href="#faq" x-text="$store.i18n.t('nav.faq')"
                        class="hover:backdrop-blur-lg hover:bg-neutral-900/50 flex hover:scale-95 transition rounded-lg px-3 py-2 text-white"></a>
                    <a href="#contact" x-text="$store.i18n.t('nav.contact')"
                        class="flex bg-[var(--green)] hover:scale-95 hover:bg-green-800 transition rounded-lg px-3 py-2 text-white"></a>
                </div>
                <button @click="open = !open"
                    class="sm:hidden text-white px-2 py-1 hover:bg-neutral-900/50 cursor-pointer transition rounded-lg">
                    <i class="fa fa-bars"></i>
                </button>
            </div>
        </div>
        <div class="bg-neutral-900/50 p-3 rounded-lg text-white backdrop-blur-lg sm:hidden" x-transition x-show="open">
            <a href="#hero" x-text="$store.i18n.t('nav.home')"
                class="flex hover:scale-98 transition rounded-lg px-2 py-1 text-white"></a>
            <a href="#about" x-text="$store.i18n.t('nav.about')"
                class="flex hover:scale-98 transition rounded-lg px-2 py-1 text-white"></a>
            <a href="#faq" x-text="$store.i18n.t('nav.faq')"
                class="flex hover:scale-98 transition rounded-lg px-2 py-1 text-white"></a>
            <a href="#contact" x-text="$store.i18n.t('nav.contact')"
                class="flex bg-[var(--green)] hover:brightness-90 hover:scale-98 transition rounded px-2 py-1 text-white"></a>
        </div>
    </div>
</header>
