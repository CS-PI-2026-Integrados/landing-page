<section id="faq" class="w-full max-w-7xl mx-auto px-6 py-24 flex flex-col md:flex-row gap-12" x-data="{ 
        active: [],
        toggle(index) {
            if(this.active.includes(index)) {
                this.active = this.active.filter(i => i != index);
            } else {
                this.active.push(index);
            }
        }
    }">

    <div class="md:w-1/3">
        <h2 class="serif text-5xl md:text-6xl text-black leading-tight" x-text="$store.i18n.t('faq.title')"></h2>
    </div>

    <div class="md:w-2/3 flex flex-col gap-4">

        <template x-for="(faq, index) in ($store.i18n.translations.faq?.questions || [])" :key="index">
            <div class="border border-gray-100 rounded-lg overflow-hidden bg-white hover:shadow">
                <button @click="toggle(index)"
                    class="w-full py-6 flex justify-between items-center text-left group transition-colors px-2">

                    <span
                        class="text-lg font-medium text-gray-800 group-hover:text-black flex-1 pr-4 min-w-0 break-words"
                        x-text="faq.q">
                    </span>

                    <span class="transform transition-transform duration-300 flex-shrink-0"
                        :class="active.includes(index) ? '-rotate-180' : ''">
                        <span class="material-symbols-outlined text-5xl">keyboard_arrow_up</span>
                    </span>

                </button>

                <div x-show="active.includes(index)" x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 -translate-y-2"
                    x-transition:enter-end="opacity-100 translate-y-0"
                    x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 translate-y-0"
                    x-transition:leave-end="opacity-0 -translate-y-2"
                    class="overflow-hidden bg-white px-2 rounded-b-lg">
                    <div class="pb-6 text-gray-600 leading-relaxed" x-text="faq.a"></div>
                </div>

            </div>
        </template>

    </div>
</section>
