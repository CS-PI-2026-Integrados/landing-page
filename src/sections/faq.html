<section id="faq" class="w-full max-w-7xl mx-auto px-6 py-24 flex flex-col md:flex-row gap-12" x-data="{ 
        faqs: [], 
        active: null,
        async loadFaqs() {
            try {
                const response = await fetch('src/data/faqs.json');
                this.faqs = await response.json();
            } catch (error) {
                console.error('Erro ao carregar FAQs:', error);
            }
        }
    }" x-init="loadFaqs()">

    <!-- title-->
    <div class="md:w-1/3">
        <h2 class="serif text-5xl md:text-6xl text-black leading-tight">FAQs</h2>
    </div>

    <!-- questions -->
    <div class="md:w-2/3 flex flex-col border-t border-gray-200">

        <template x-for="(faq, index) in faqs" :key="index">
            <div class="border-b border-gray-200">
                <button @click="active === index ? active = null : active = index"
                    class="w-full py-6 flex justify-between items-center text-left group hover:bg-gray-50 transition-colors px-2">
                    <span class="text-lg font-medium text-gray-800 group-hover:text-black" x-text="faq.question"></span>

                    <!-- animated icon -->
                    <span class="transform transition-transform duration-300"
                        :class="active === index ? 'rotate-180' : ''">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-5 h-5 text-gray-500">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                        </svg>
                    </span>

                </button>

                <!-- soft animation-->
                <div x-show="active === index" x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 -translate-y-2"
                    x-transition:enter-end="opacity-100 translate-y-0"
                    x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 translate-y-0"
                    x-transition:leave-end="opacity-0 -translate-y-2"
                    class="overflow-hidden bg-gray-50 px-2 rounded-b-lg">
                    <div class="pb-6 text-gray-600 leading-relaxed" x-text="faq.answer"></div>
                </div>

            </div>
        </template>

    </div>
</section>
