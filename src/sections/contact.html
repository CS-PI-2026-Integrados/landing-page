<div class="container mx-auto" id="#contact">
    <section id="contact-section" class="flex justify-center h-full">
        <div class="p-20 w-full grid grid-cols-1 md:grid-cols-2 gap-6">

            <div class="flex flex-col">
                <h1 class="text-5xl mb-12 serif">Contate-nos</h1>
                <div id="contatos" class="flex flex-col gap-4">
                    <div class="flex flex-row items-center gap-4">
                        <img src="./assets/icon/email.svg" alt="Email" class="w-6 h-6">
                        <span>contato@sicape.com</span>
                    </div>
                    <div class="flex flex-row items-center gap-4">
                        <img src="./assets/icon/location-pointer.svg" alt="Localização" class="w-6 h-6">
                        <span>Rua José Felipe Tequinha, 1400 - Jardim das Nacoes, Paranavaí - PR</span>
                    </div>
                    <div class="flex flex-row items-center gap-4">
                        <img src="./assets/icon/linkedin.svg" alt="Linkedin" class="w-6 h-6">
                        <a href="https://linkedin.com/company/sicapepenal/">Sicape</a>
                    </div>
                    <div class="flex flex-row items-center gap-4">
                        <img src="./assets/icon/github.svg" alt="Linkedin" class="w-6 h-6">
                        <a href="https://linkedin.com/company/sicapepenal/">Integrados</a>
                    </div>
                </div>
            </div>

            <div>
                <form id="formContato" class="flex flex-col gap-4" x-data="{
                        name: '',
                        email: '',
                        message: '',
                        terms: false,
                        errors: { name: false, email: false, message: false, terms: false },
                        msgs: { name: '', email: '', message: '', terms: '' },

                        validate() {
                            let isValid = true;
                            
                            this.errors = { name: false, email: false, message: false, terms: false };

                            if (this.name.trim() === '') {
                                this.errors.name = true;
                                this.msgs.name = 'O campo nome é obrigatório';
                                isValid = false;
                            }

                            if (this.email.trim() === '' || !this.email.includes('@')) {
                                this.errors.email = true;
                                this.msgs.email = 'Por favor, digite um e-mail válido. Ex: jose@email.com';
                                isValid = false;
                            }

                            if (this.message.trim() === '') {
                                this.errors.message = true;
                                this.msgs.message = 'A mensagem não pode ser vazia';
                                isValid = false;
                            }

                            if (!this.terms) {
                                this.errors.terms = true;
                                this.msgs.terms = 'Você precisa aceitar os termos.';
                                isValid = false;
                            }

                            if (isValid) {
                                alert('✅ Tudo certo! Formulário validado.');
                                // código para enviar
                            }
                        }
                    }" @submit.prevent="validate()">
                    <div>
                        <label for="name">Nome</label>
                        <input x-model="name" :style="errors.name ? 'border: 2px solid red' : ''"
                            class="bg-transparent w-full border border-zinc-400 h-10 px-4 py-3" id="name" type="text"
                            name="fname">

                        <span x-show="errors.name" x-text="msgs.name" style="color: red;" class="text-sm"></span>
                    </div>

                    <div>
                        <label for="email">E-mail</label>
                        <input x-model="email" :style="errors.email ? 'border: 2px solid red' : ''"
                            class="bg-transparent w-full border border-zinc-400 h-10 px-4 py-3" id="email" type="text"
                            name="femail">

                        <span x-show="errors.email" x-text="msgs.email" style="color: red;" class="text-sm"></span>
                    </div>

                    <div>
                        <label for="message">Mensagem</label>
                        <textarea x-model="message" :style="errors.message ? 'border: 2px solid red' : ''" id="message"
                            name="fmessage"
                            class="bg-transparent w-full border border-zinc-400 p-2 h-32 px-4 py-3"></textarea>

                        <span x-show="errors.message" x-text="msgs.message" style="color: red;" class="text-sm"></span>
                    </div>

                    <div>
                        <input x-model="terms" class="bg-transparent" id="term-check" type="checkbox" name="fterm">
                        <label for="term-check">Eu aceito os termos</label>

                        <span x-show="errors.terms" x-text="msgs.terms" style="color: red; display: block;"
                            class="text-sm mt-1"></span>
                    </div>

                    <div>
                        <button type="submit"
                            class="bg-gradient-to-r from-green-600 to-green-500 border border-neutral-800/10 shadow-lg hover:bg-green-800 transition hover:scale-95 text-white font-medium py-3 px-8 self-start rounded-md"
                            id="fbutton">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>
