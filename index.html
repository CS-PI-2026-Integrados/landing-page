<!doctype html>
<html x-data="{highContrast: false}" x-bind:class="highContrast ? 'contrast-130' : ''">
  <head>
    <title>SICAPE</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="dist/tailwindcss/index.global.js"></script>
    <script defer src="dist/alpinejs/cdn.min.js"></script>
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="style/typo.css" />
    <link rel="stylesheet" href="style/palette.css" />
    <style>
      :root {
        font-size: 16px;
      }
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div x-data x-cloak x-show="!$store.i18n.isLoading" x-transition.opacity.duration.500ms>
      <div
        x-data="{ content: '' }"
        x-init="fetch('src/sections/header.html').then(res => res.text()).then(html => content = html)"
        x-html="content"
      ></div>

      <div
        x-data="{ content: '' }"
        x-init="fetch('src/sections/hero.html').then(res => res.text()).then(html => content = html)"
        x-html="content"
      ></div>

      <div class="max-w-7xl w-full mx-auto">
        <div
          x-data="{ content: '' }"
          x-init="fetch('src/sections/about.html').then(res => res.text()).then(html => content = html)"
          x-html="content"
        ></div>
        <div
          x-data="{ content: '' }"
          x-init="fetch('src/sections/cards.html').then(res => res.text()).then(html => content = html)"
          x-html="content"
        ></div>
        <div
          x-data="{ content: '' }"
          x-init="fetch('src/sections/faq.html').then(res => res.text()).then(html => content = html)"
          x-html="content"
        ></div>
        <div
          x-data="{ content: '' }"
          x-init="fetch('src/sections/team.html').then(res => res.text()).then(html => content = html)"
          x-html="content"
        ></div>
        <div
          x-data="{ content: '' }"
          x-init="fetch('src/sections/contact.html').then(res => res.text()).then(html => content = html)"
          x-html="content"
        ></div>
        <div
          x-data="{ content: '' }"
          x-init="fetch('src/sections/footer.html').then(res => res.text()).then(html => content = html)"
          x-html="content"
        ></div>
      </div>
    </div>
  </body>

  <script>
    //inicialização da internacionalização
    document.addEventListener('alpine:init', () => {
      Alpine.store('i18n', {
        locale: '',
        translations: {},
        isLoading: true,
        flags: {
          pt: '🇧🇷',
          en: '🇺🇸',
          es: '🇪🇸',
        },

        get currentFlag() {
          return this.flags[this.locale] || '🇧🇷';
        },

        async init() {
          let targetLang = localStorage.getItem('sicape_lang');

          if (!targetLang) {
            const browserLang = navigator.language.slice(0, 2);
            targetLang = ['pt', 'en', 'es'].includes(browserLang) ? browserLang : 'pt';
          }

          await this.setLang(targetLang);
        },

        async setLang(lang) {
          this.isLoading = true;

          try {
            const response = await fetch(`locales/${lang}.json`);
            if (!response.ok) throw new Error('Falha ao carregar idioma');

            this.translations = await response.json();
            this.locale = lang;

            localStorage.setItem('sicape_lang', lang);
            this.updateSEO();
          } catch (error) {
            console.error('Erro na internacionalização:', error);
          } finally {
            this.isLoading = false;
          }
        },

        t(path) {
          return path.split('.').reduce((obj, key) => {
            return obj && obj[key] !== undefined ? obj[key] : path;
          }, this.translations);
        },

        updateSEO() {
          document.documentElement.lang = this.locale;

          if (this.translations.meta) {
            document.title = this.translations.meta.title || 'SICAPE';

            let metaDesc = document.querySelector('meta[name="description"]');
            if (!metaDesc) {
              metaDesc = document.createElement('meta');
              metaDesc.name = 'description';
              document.head.appendChild(metaDesc);
            }
            metaDesc.content = this.translations.meta.description || '';
          }
        },
      });
    });

    //scroll e fonte
    window.addEventListener('load', () => {
      window.addEventListener('scroll', () => {
        const header = document.getElementById('navbar');
        const logo = document.getElementById('logo');
        if (!header) return;

        if (window.scrollY === 0) {
          header.classList.remove('bg-neutral-900/50');
          header.classList.remove('backdrop-blur-[30px]');
          logo.classList.remove('brightness-200');
        } else {
          header.classList.add('bg-neutral-900/50');
          header.classList.add('backdrop-blur-[30px]');
          logo.classList.add('brightness-200');
        }
      });
    });

    function changeFontSize(change) {
      const htmlElement = document.documentElement;
      let currentSize = parseFloat(window.getComputedStyle(htmlElement).fontSize);

      let newSize = currentSize + change;

      if (newSize < 10) newSize = 10;
      if (newSize > 30) newSize = 30;

      htmlElement.style.fontSize = `${newSize}px`;
    }
  </script>
</html>
