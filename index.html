<!doctype html>
<html x-data="{highContrast: false}" x-bind:class="highContrast ? 'contrast-130' : ''">
  <head>
    <title>SICAPE</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/dist/tailwindcss/index.global.js"></script>
    <script defer src="/dist/alpinejs/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="/style/typo.css">
    <link rel="stylesheet" href="/style/palette.css">
    <style>
      :root {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div x-data="{ content: '' }" x-init="fetch('src/sections/header.html').then(response => response.text()).then(html => content = html)" x-html="content"></div>
    <div x-data="{ content: '' }" x-init="fetch('src/sections/hero.html').then(response => response.text()).then(html => content = html)" x-html="content"></div>
    <div x-data="{ content: '' }" x-init="fetch('src/sections/about.html').then(response => response.text()).then(html => content = html)" x-html="content"></div>
    <div x-data="{ content: '' }" x-init="fetch('src/sections/cards.html').then(response => response.text()).then(html => content = html)" x-html="content"></div>
    <div x-data="{ content: '' }" x-init="fetch('src/sections/faq.html').then(response => response.text()).then(html => content = html)" x-html="content"></div>
    <div x-data="{ content: '' }" x-init="fetch('src/sections/team.html').then(response => response.text()).then(html => content = html)" x-html="content"></div>
    <div x-data="{ content: '' }" x-init="fetch('src/sections/contact.html').then(response => response.text()).then(html => content = html)" x-html="content"></div>
    <div x-data="{ content: '' }" x-init="fetch('src/sections/footer.html').then(response => response.text()).then(html => content = html)" x-html="content"></div>
  </body>
  <script>
  window.addEventListener('load', () => {
    window.addEventListener('scroll', () => {
      const header = document.getElementById('navbar');
      const logo = document.getElementById('logo');
      if (!header) return;

      if (window.scrollY === 0) {
        header.classList.remove('bg-neutral-900/50');
        header.classList.remove('backdrop-blur-[30px]');
        logo.classList.remove('brightness-150');
      } else {
        header.classList.add('bg-neutral-900/50');
        header.classList.add('backdrop-blur-[30px]');
        logo.classList.add('brightness-150');
      }
    });
  });

  function changeFontSize(change) {
      const htmlElement = document.documentElement;
      let currentSize = parseFloat(window.getComputedStyle(htmlElement).fontSize);
      
      let newSize = currentSize + change;
      
      if (newSize < 10) newSize = 10;
      if (newSize > 30) newSize = 30;

      htmlElement.style.fontSize = `${newSize}px`;
  }
</script>
</html>
